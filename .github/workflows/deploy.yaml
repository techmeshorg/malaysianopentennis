name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Weekly rebuild (Mondays 09:17 Malaysia time) so date-derived event statuses
  # (Upcoming / Ongoing) stay current between content updates.
  schedule:
    - cron: '17 1 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build with Astro
        uses: withastro/action@v4

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4