<text x="378.0" y="100" text-anchor="middle" font-size="13" fill="#5A6862">pt 6</text>
<line x1="409" y1="82" x2="409" y2="210" stroke="#E8C23B" stroke-width="4"/>
<text x="409" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#7A5A12">change ends</text>
<rect x="412" y="110" width="56" height="70" rx="8" fill="#1F6FB2"/>
<text x="440.0" y="140" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">B</text>
