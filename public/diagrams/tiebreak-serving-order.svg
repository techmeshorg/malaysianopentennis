<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 844 300" role="img" aria-labelledby="t2 d2" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif">
<title id="t2">Who serves in a tie-break</title>
<desc id="d2">The first twelve points of a tie-break. Player A, whose turn it was to serve, serves point 1 from the deuce court. Player B then serves points 2 and 3, A serves points 4 and 5, B serves 6 and 7, and so on, each player serving two points in a row. Each serving turn starts from the advantage court. Players change ends after every six points, after point 6 and point 12.</desc>
<text x="40" y="40" font-size="20" font-weight="800" fill="#15201A">Tie-break serving order (first 12 points)</text>
<text x="40" y="66" font-size="14" fill="#5A6862">Each box is one point. A serves first; then two serves each, alternating. Change ends every 6 points.</text>
<rect x="40" y="110" width="56" height="70" rx="8" fill="#167D45"/>
<text x="68.0" y="140" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">A</text>
<text x="68.0" y="164" text-anchor="middle" font-size="12" fill="#E6F2EA">Deuce</text>
<text x="68.0" y="100" text-anchor="middle" font-size="13" fill="#5A6862">pt 1</text>
<rect x="102" y="110" width="56" height="70" rx="8" fill="#1F6FB2"/>
<text x="130.0" y="140" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">B</text>
<text x="130.0" y="164" text-anchor="middle" font-size="12" fill="#E6F2EA">Ad</text>
<text x="130.0" y="100" text-anchor="middle" font-size="13" fill="#5A6862">pt 2</text>
<rect x="164" y="110" width="56" height="70" rx="8" fill="#1F6FB2"/>
<text x="192.0" y="140" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">B</text>
<text x="192.0" y="164" text-anchor="middle" font-size="12" fill="#E6F2EA">Deuce</text>
<text x="192.0" y="100" text-anchor="middle" font-size="13" fill="#5A6862">pt 3</text>
<rect x="226" y="110" width="56" height="70" rx="8" fill="#167D45"/>
<text x="254.0" y="140" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">A</text>
<text x="254.0" y="164" text-anchor="middle" font-size="12" fill="#E6F2EA">Ad</text>
<text x="254.0" y="100" text-anchor="middle" font-size="13" fill="#5A6862">pt 4</text>
<rect x="288" y="110" width="56" height="70" rx="8" fill="#167D45"/>
<text x="316.0" y="140" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">A</text>
<text x="316.0" y="164" text-anchor="middle" font-size="12" fill="#E6F2EA">Deuce</text>
<text x="316.0" y="100" text-anchor="middle" font-size="13" fill="#5A6862">pt 5</text>
<rect x="350" y="110" width="56" height="70" rx="8" fill="#1F6FB2"/>
<text x="378.0" y="140" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">B</text>
