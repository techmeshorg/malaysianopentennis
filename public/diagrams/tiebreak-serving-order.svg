<text x="688.0" y="164" text-anchor="middle" font-size="12" fill="#E6F2EA">Deuce</text>
<text x="688.0" y="100" text-anchor="middle" font-size="13" fill="#5A6862">pt 11</text>
<rect x="722" y="110" width="56" height="70" rx="8" fill="#167D45"/>
<text x="750.0" y="140" text-anchor="middle" font-size="22" font-weight="800" fill="#fff">A</text>
<text x="750.0" y="164" text-anchor="middle" font-size="12" fill="#E6F2EA">Ad</text>
<text x="750.0" y="100" text-anchor="middle" font-size="13" fill="#5A6862">pt 12</text>
<line x1="781" y1="82" x2="781" y2="210" stroke="#E8C23B" stroke-width="4"/>
<text x="781" y="232" text-anchor="middle" font-size="13" font-weight="700" fill="#7A5A12">change ends</text>
<rect x="40" y="262" width="18" height="18" rx="4" fill="#167D45"/><text x="66" y="276" font-size="14" fill="#15201A">Player A serves</text>
<rect x="210" y="262" width="18" height="18" rx="4" fill="#1F6FB2"/><text x="236" y="276" font-size="14" fill="#15201A">Player B serves</text>
<text x="380" y="276" font-size="14" fill="#5A6862">Deuce / Ad = which half of the court the serve is hit from</text>
