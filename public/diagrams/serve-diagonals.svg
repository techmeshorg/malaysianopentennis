<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 621 622" role="img" aria-labelledby="t d" font-family="-apple-system,Segoe UI,Roboto,Arial,sans-serif">
<title id="t">Where the serve must land</title><desc id="d">Top-down tennis court drawn to scale. The server stands behind the baseline. At an even score the server stands right of the centre mark and serves diagonally into the receiver's right-hand (deuce) service box, shaded yellow. At an odd score the server stands left of the centre mark and serves into the left-hand (advantage) box, shaded blue.</desc>
<rect x="22" y="16" width="297.34000000000003" height="592.9399999999999" fill="#2E8B57" rx="6"/>
<rect x="50" y="40" width="241.34" height="522.9399999999999" fill="#167D45" stroke="#fff" stroke-width="3"/>
<line x1="80.1" y1="40.0" x2="80.1" y2="562.9" stroke="#fff" stroke-width="3" />
<line x1="261.2" y1="40.0" x2="261.2" y2="562.9" stroke="#fff" stroke-width="3" />
<line x1="80.1" y1="160.7" x2="261.2" y2="160.7" stroke="#fff" stroke-width="3" />
<line x1="80.1" y1="442.3" x2="261.2" y2="442.3" stroke="#fff" stroke-width="3" />
<line x1="170.7" y1="160.7" x2="170.7" y2="442.3" stroke="#fff" stroke-width="3" />
<line x1="170.7" y1="40.0" x2="170.7" y2="47.7" stroke="#fff" stroke-width="3" />
<line x1="170.7" y1="562.9" x2="170.7" y2="555.2" stroke="#fff" stroke-width="3" />
